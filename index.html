function destinationDiagram(list){const c=selected();return `<div class="approach-diagram"><p class="sub">마지막에 모이는 곳</p><div class="approach-lines">${list.map(g=>`<div style="--row-color:${g.color}"><b>${g.name}</b><span>쓰레기 줍기 마침</span><span class="arr">→</span><strong>${c.short} 옆 모이는 곳</strong></div>`).join('')}</div></div>`;}
function movementCard(team){const list=team?[team]:teams;return `<section class="card movement-card"><div class="flowhead"><h2>02 전도&amp;플로깅 동선</h2><button data-pause aria-pressed="${paused}">${paused?'깜박임 켜기':'깜박임 끄기'}</button></div><p class="moving-guide">산책로를 따라 계속 걸으며 만나는 분들에게 전도합니다.</p><p class="operation-strip">세 조 동일 · 전도 40분 + 플로깅 30분</p>${tabsDest()}${list.map(movementText).join('')}<div class="tools"><button data-zoom="out" aria-label="지도 축소">−</button><button data-zoom="in" aria-label="지도 확대">+</button><button data-zoom="reset">원위치</button></div><button class="fullmap" data-fullmap>지도 크게 보기</button><div class="vp" id="vp"><div id="mi">${guideSvg(list)}</div></div><div class="legend2"><span><i class="line-sample"></i>선: 걸으며 전도</span><span><i class="line-sample dashed"></i>점선: 쓰레기 줍기</span><span>출: 출발 · 전: 전도 시작 · 줍: 쓰레기 줍기 시작</span><span>노란 테두리: 모이는 곳 주변</span></div><p class="sub" style="margin-top:6px">형광펜 선은 행사에서 걸을 방향을 보여줍니다. 정확한 길은 아래 버튼으로 확인하세요.</p><div class="point-key">${list.map(g=>`<p style="--row-color:${g.color}"><b>${g.name}</b> ${g.id===1?'제5주차장 → 전1 → 줍1':`출${g.id} → 줍${g.id}`} → ${selected().short}</p>`).join('')}${list.some(g=>g.id===1)?'<small>제5주차장은 안내도 밖에 있어요. 출발지는 주소 복사나 길찾기로 확인해주세요.</small>':''}</div>${destinationDiagram(list)}${destination===1?`<div class="real-directions"><p class="sub">운동장까지 바로 걸으면 · 전도와 쓰레기 줍는 시간은 제외</p>${list.map(g=>`<a class="navlink" href="${directions[g.id].url}" target="_blank" rel="noopener">${g.name} 길찾기 열기 · 제${g.park}주차장 → 운동장 (${directions[g.id].time})</a>`).join('')}</div>`:''}</section>`;}
function destinationCard(team){const c=selected();return `<section class="card"><h2>03 최종 집합장소</h2>${tabsDest()}<div class="place"><div><p class="k">17:40 도착 목표 · 17:45~17:55 단체사진</p><p class="v">${c.name}</p><p class="a">${c.address}</p></div><button class="copy" data-copy="final" aria-label="최종 집합장소 주소 복사">주소 복사</button></div><p class="arrival-note">${c.guide}</p><a href="${c.map}" target="_blank" rel="noopener" style="display:inline-block;margin-top:9px">선택한 집합장소 지도 열기</a><details><summary>장소 확인</summary><p class="sub">주소는 운영자가 지정한 집합 후보입니다. 사람들이 모일 자리와 사진 찍을 자리는 직접 보고 정합니다합니다. 운동장·족구장 공식 시설주소는 송죽동 417-32로 안내되며, 복사 주소는 운영자가 지정한 지번입니다. 여의루 누각 내부와 경기 중 코트는 집합 장소로 사용하지 않습니다.</p></details></section>`;}
function overallTimeline(){const r=[['15:40~15:50','예배 종료 · 출발 준비'],['15:50~16:15','교회 → 조별 주차장'],['16:15~16:30','하차 · 집합 · 전도 시작 구역 이동'],['16:30~17:10','걸으며 전도 · 세 조 40분'],['17:10~17:40','쓰레기 주우며 이동 · 세 조 30분'],['17:40~17:45','도착 · 인원 다시 확인'],['17:45~17:55','단체사진 · 17:55 마무리']];return `<section class="card"><div class="timeline-title"><h2>전체 타임라인</h2><span class="end-pill">18시 전 종료</span></div><p class="finish-time">17:55 마무리</p><ol class="steps">${r.map(a=>`<li><time>${a[0]}</time><div><strong>${a[1]}</strong></div></li>`).join('')}</ol></section>`;}
function render(){const t=teams[+tab-1];document.documentElement.style.setProperty('--accent',t?t.color:'#26724d');document.querySelectorAll('[role=tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===tab));b.tabIndex=b.dataset.tab===tab?0:-1;});$('#content').setAttribute('aria-labelledby','tab-'+tab);$('#content').className='wrap'+(paused?' paused':'');$('#content').innerHTML=`${t?`<p class="group">${t.name} · ${t.village}</p>`:''}${t?'':overallTimeline()}${startCard(t)}${movementCard(t)}${destinationCard(t)}<div class="fallback hidden" id="fb"><input id="fbt" readonly aria-label="복사할 주소"></div>`;scale=1;x=y=0;addArrows();bindMap();}
function addArrows(){document.querySelectorAll('[data-route]').forEach(p=>{const color=teams[+p.dataset.route-1].color,neon=p.dataset.neon,L=p.getTotalLength(),n=Math.max(1,Math.round(L/310));for(let i=1;i<=n;i++){const d=L*i/(n+1),a=p.getPointAtLength(d),b=p.getPointAtLength(Math.min(L,d+3)),angle=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform',`translate(${a.x} ${a.y}) rotate(${angle})`);g.setAttribute('class','highlighter-arrow');g.style.animationDelay=(i*.18)+'s';for(const [stroke,width]of[[neon,13],[color,3]]){const e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('d','M-9 -10 L4 0 L-9 10');e.setAttribute('stroke',stroke);e.setAttribute('stroke-width',width);e.setAttribute('stroke-linecap','round');e.setAttribute('stroke-linejoin','round');e.setAttribute('fill','none');g.append(e);}p.parentNode.insertBefore(g,p.parentNode.querySelector('g[font-family]'));}});}
function apply(){if($('#mi'))$('#mi').style.transform=`translate(${x}px,${y}px) scale(${scale})`;}
function bindMap(){const v=$('#vp'),pts=new Map();let before=null;v.addEventListener('pointerdown',e=>{v.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});before=null;});v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const old=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){x+=e.clientX-old.x;y+=e.clientY-old.y;}else{const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(before)scale=Math.max(1,Math.min(4,scale*d/before));before=d;}x=Math.max(-v.clientWidth*scale/2,Math.min(v.clientWidth*scale/2,x));y=Math.max(-v.clientHeight*scale/2,Math.min(v.clientHeight*scale/2,y));apply();});const end=e=>{pts.delete(e.pointerId);before=null;};v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);v.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(1,Math.min(4,scale+(e.deltaY<0?.2:-.2)));apply();},{passive:false});}
function toast(msg){$('#toast').textContent=msg;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2800);}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;try{history.replaceState(null,'','#'+tab);}catch(err){}render();window.scrollTo(0,0);return;}if(b.dataset.dest){destination=+b.dataset.dest;try{localStorage.setItem(KEY,destination);}catch(err){}const top=window.scrollY;render();window.scrollTo(0,top);return;}if(b.hasAttribute('data-fullmap')){const full=$('.movement-card').classList.toggle('mapfull');b.textContent=full?'지도 닫기':'지도 크게 보기';return;}if(b.hasAttribute('data-pause')){paused=!paused;$('#content').classList.toggle('paused',paused);b.textContent=paused?'깜박임 켜기':'깜박임 끄기';b.setAttribute('aria-pressed',paused);return;}if(b.dataset.zoom){if(b.dataset.zoom==='reset'){scale=1;x=y=0;}else scale=Math.max(1,Math.min(4,scale+(b.dataset.zoom==='in'?.5:-.5)));apply();return;}if(b.dataset.copy){const v=b.dataset.copy==='final'?`${selected().name} / ${selected().address}`:teams[+b.dataset.copy.replace('start','')-1].address;try{await navigator.clipboard.writeText(v);toast('주소를 복사했습니다.');}catch(err){$('#fb').classList.remove('hidden');$('#fbt').value=v;$('#fbt').focus();$('#fbt').select();let ok=false;try{ok=document.execCommand('copy');}catch(x){}toast(ok?'주소를 복사했습니다.':'선택된 주소를 복사해 주세요.');}}});
document.addEventListener('keydown',e=>{if(!e.target.matches('[role=tab]')||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const btn=[...document.querySelectorAll('[role=tab]')],i=btn.indexOf(e.target),n=e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:-1)+4)%4;btn[n].click();btn[n].focus();});render();})();
</script></body></html>
